<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a17">
  <meta name="description" content="A browser-based code workspace.">

  <title>Slate</title>

  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/src/styles.css">

  <script>
    try {
      const theme = localStorage.getItem("slate.theme");

      if (theme === "light" || theme === "dark") {
        document.documentElement.dataset.theme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute(
            "content",
            theme === "light" ? "#f5f6f2" : "#171a17"
          );
      }
    } catch {}
  </script>
</head>

<body data-mobile="code">
  <header class="topbar">
    <button
      class="brand"
      type="button"
      data-act="home"
      aria-label="Workspace home"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 5h16M4 12h12M4 19h16"></path>
      </svg>
      <strong>Slate</strong>
    </button>

    <button
      id="projectName"
      type="button"
      data-act="rename-project"
      hidden
    ></button>

    <span class="spacer" aria-hidden="true"></span>

    <button
      type="button"
      data-act="commands"
      aria-haspopup="dialog"
      aria-controls="dialog"
    >
      Commands
      <kbd id="commandKey">Ctrl+K</kbd>
    </button>

    <button id="themeButton" type="button" data-act="theme">
      Light theme
    </button>

    <button
      type="button"
      data-act="settings"
      aria-haspopup="dialog"
      aria-controls="dialog"
    >
      Settings
    </button>
  </header>

  <noscript>
    <p class="noscript">
      Enable JavaScript in your browser to use Slate.
    </p>
  </noscript>

  <main id="home">
    <section class="home-inner" aria-labelledby="homeTitle">
      <h1 id="homeTitle">Workspace</h1>
      <p class="muted">Choose how to begin.</p>

      <div class="home-choices">
        <button type="button" data-act="blank">
          Start with a blank page
        </button>

        <button
          type="button"
          data-act="starters"
          aria-haspopup="dialog"
          aria-controls="dialog"
        >
          Open a starter project
        </button>

        <button type="button" data-act="open-folder">
          Open a folder from my computer
        </button>
      </div>

      <div id="resume" hidden>
        <button type="button" data-act="resume">
          Return to editor
        </button>
      </div>

      <p class="home-note">
        No account needed. Projects are saved in this browser.
        Imported files stay unchanged.
      </p>
    </section>
  </main>

  <main id="work" hidden>
    <aside id="sidebar" aria-label="Project navigation">
      <div class="sidebar-tabs">
        <button
          id="filesTab"
          type="button"
          data-act="files"
          aria-pressed="true"
        >
          Files
        </button>

        <button
          id="searchTab"
          type="button"
          data-act="search"
          aria-pressed="false"
        >
          Search
        </button>
      </div>

      <section id="filePanel" aria-label="Project files">
        <div class="file-actions">
          <button type="button" data-act="new-file">
            New file
          </button>

          <button type="button" data-act="new-folder">
            Folder
          </button>

          <button
            type="button"
            data-act="file-menu"
            aria-label="More file actions"
            aria-haspopup="dialog"
            aria-controls="dialog"
          >
            More
          </button>
        </div>

        <nav id="tree" aria-label="Files and folders"></nav>
      </section>

      <section id="searchPanel" aria-label="Search project" hidden>
        <label for="searchQuery">Search all files</label>

        <input
          id="searchQuery"
          type="search"
          placeholder="Find text"
          autocomplete="off"
          spellcheck="false"
        >

        <label class="sr-only" for="replaceText">Replace with</label>

        <input
          id="replaceText"
          type="text"
          placeholder="Replace with"
          autocomplete="off"
          spellcheck="false"
        >

        <label class="check">
          <input id="matchCase" type="checkbox">
          Match case
        </label>

        <button type="button" data-act="replace-all">
          Replace all matches
        </button>

        <p id="searchSummary" class="muted" role="status"></p>
        <div id="searchResults"></div>
      </section>
    </aside>

    <nav class="mobile-switch" aria-label="Workspace view">
      <button type="button" data-act="mobile-files">
        Files
      </button>

      <button
        id="mobileCode"
        type="button"
        data-act="show-code"
        aria-pressed="true"
      >
        Editor
      </button>

      <button
        id="mobilePreview"
        type="button"
        data-act="show-preview"
        aria-pressed="false"
      >
        Preview
      </button>
    </nav>

    <section class="code-pane" aria-label="Code editor">
      <nav id="tabs" aria-label="Open files"></nav>

      <div class="breadcrumbs">
        <span id="breadcrumb"></span>
        <span class="spacer" aria-hidden="true"></span>

        <button type="button" data-act="find">
          Find
          <kbd id="findKey">Ctrl+F</kbd>
        </button>

        <button type="button" data-act="save">
          Save
        </button>
      </div>

      <div id="editorHost"></div>

      <div id="editorEmpty" hidden>
        <p>No file is open.</p>
        <button type="button" data-act="new-file">
          New file
        </button>
      </div>
    </section>

    <section class="preview-pane" aria-label="Page preview">
      <div class="preview-bar">
        <span>Preview</span>

        <select id="entry" aria-label="Page to preview" hidden></select>

        <span class="spacer" aria-hidden="true"></span>

        <button
          id="liveButton"
          type="button"
          data-act="live"
          aria-pressed="true"
        >
          Live
        </button>

        <button class="primary" type="button" data-act="run">
          Run
          <kbd id="runKey">Ctrl+Enter</kbd>
        </button>
      </div>

      <div id="previewArea">
        <iframe
          id="previewFrame"
          title="Page preview"
          sandbox="allow-scripts allow-forms"
          referrerpolicy="no-referrer"
        ></iframe>

        <div id="previewEmpty" class="pane-empty" hidden>
          <p id="previewMessage"></p>

          <button type="button" data-act="new-page">
            New HTML page
          </button>
        </div>
      </div>

      <div class="preview-bottom">
        <span id="previewHint">Local preview</span>

        <button
          id="consoleButton"
          type="button"
          data-act="console"
          aria-controls="consolePanel"
          aria-expanded="false"
        >
          Console
        </button>
      </div>

      <section id="consolePanel" aria-label="Preview console" hidden>
        <div class="console-toolbar">
          <span>Console</span>

          <button type="button" data-act="clear-console">
            Clear
          </button>
        </div>

        <div id="consoleOutput">
          <p class="muted">No console messages.</p>
          <button type="button" data-act="run">
            Run preview
          </button>
        </div>
      </section>
    </section>
  </main>

  <footer>
    <span id="saveState">No project open</span>
    <span id="cursorState"></span>
    <span class="spacer" aria-hidden="true"></span>
    <span id="languageState"></span>
    <span id="offlineState"></span>
    <span class="device-note">Browser storage only</span>
  </footer>

  <div id="notice" role="status" aria-live="polite" hidden>
    <span id="noticeText"></span>
    <button type="button" data-act="dismiss-notice">
      Close
    </button>
  </div>

  <dialog id="dialog" aria-labelledby="dialogTitle">
    <div class="dialog-bar">
      <h2 id="dialogTitle"></h2>

      <button id="dialogClose" type="button">
        Close
      </button>
    </div>

    <div id="dialogContent"></div>
  </dialog>

  <input id="folderInput" type="file" webkitdirectory multiple hidden>
  <input id="filesInput" type="file" multiple hidden>
  <input
    id="zipInput"
    type="file"
    accept=".zip,application/zip"
    hidden
  >

  <script type="module" src="/src/main.js"></script>
</body>
</html>
